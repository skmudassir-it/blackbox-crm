# docker-compose.yml — Blackbox CRM Multi-Service
# Micro-application architecture: each module gets its own container.
# Dokploy manages these as separate applications from the same GitHub repo.

services:
  # ---- Landing Page / Frontend ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://backend:4000
    restart: unless-stopped
    networks:
      - blackbox-net

  # ---- Backend API (Express + Mongoose) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=mongodb://blackbox_auth:AuthMongo1fb44160%239db2@mongo-transmit-bluetooth-feed-93872i:27017/?authSource=admin
      - JWT_SECRET=blackbox-crm-jwt-secret-change-in-production-2026
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://blackbox-crm.207.180.245.89.nip.io
    depends_on:
      - auth-mongo
    restart: unless-stopped
    networks:
      - blackbox-net

  # ---- MongoDB (Auth & User Management) ----
  auth-mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_DATABASE=blackbox_auth
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - blackbox-net

networks:
  blackbox-net:
    driver: bridge

volumes:
  mongo-data:
