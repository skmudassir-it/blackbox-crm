# docker-compose.yml — Blackbox CRM Multi-Service
# Micro-application architecture: each module gets its own container.
# Dokploy manages these as separate applications from the same GitHub repo.

services:
  # ---- Landing Page / Frontend ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - blackbox-net

